<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset PCWL password</title>
  <link rel="stylesheet" href="/styles.css" />
  <script>
    window.__PCWL_PAGE_CONFIG__ = {
      apiBaseUrl: '/api',
      homeUrl: '/',
    };
  </script>
  <script src="/js/page-config.js" defer></script>
</head>
<body>
  <main class="app">
    <section class="panel account-panel">
      <h1>Reset password</h1>
      <p class="account-hint">Choose a new password for your PCWL account.</p>
      <form id="reset-password-form" class="account-form" autocomplete="off" novalidate>
        <div class="form-row">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" name="password" minlength="8" autocomplete="new-password" required />
        </div>
        <div class="form-row">
          <label for="confirm-password">Confirm password</label>
          <input type="password" id="confirm-password" name="confirmPassword" minlength="8" autocomplete="new-password" required />
        </div>
        <div class="account-actions">
          <button type="submit" class="primary">Reset password</button>
          <p class="account-hint">
            <a class="account-link" href="/">Return to login</a>
          </p>
        </div>
        <div id="reset-message" class="form-message info" role="status" aria-live="polite">
          Enter a new password to continue.
        </div>
      </form>
    </section>
  </main>
  <script src="/js/reset-password.js" defer></script>
</body>
</html>
